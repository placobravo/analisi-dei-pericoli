{% extends 'portal/base.html' %}
{% block title %}Cambia password · Analisi dei pericoli{% endblock %}
{% block page_class %}page-narrow{% endblock %}
{% block content %}
<section class="panel form-panel">
  <h1>Cambia password</h1>
  <form method="post" class="stack">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions"><button type="submit" class="button primary">Salva password</button><a href="{% url 'home' %}">Annulla</a></div>
  </form>
</section>
{% endblock %}
